name = "Fortran Fixed Form"
grammar = "fortran_fixed"
code_fence_block_name = "fortran77"
path_suffixes = ["f", "F", "for", "FOR", "f77", "F77", "ftn", "FTN", "fpp", "FPP"]
# `!` comments work from column 7 on; there is no way to make Zed put a `C`
# in column 1.
line_comments = ["! ", "!> ", "!! "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
increase_indent_pattern = "(?i)^\\s*(\\d+\\s+)?(\\w+\\s*:\\s*)?((else\\s*)?if\\b.*\\bthen\\s*(!.*)?$|else\\b|do\\b|select\\s*(case|type|rank)\\b|case\\b|rank\\b|(type|class)\\s+is\\b|class\\s+default\\b|associate\\b|critical\\b|block\\s*(!.*)?$|(abstract\\s+)?interface\\b|((pure|impure|elemental|recursive|non_recursive|module)\\s+)*(subroutine|function)\\b|module\\s+\\w+\\s*(!.*)?$|submodule\\b|program\\b|type(\\s*,.*::|\\s+|\\s*::)\\s*\\w+\\s*(!.*)?$|contains\\b)"
decrease_indent_pattern = "(?i)^\\s*(\\d+\\s+)?(end(\\s*(do|if|select|where|forall|associate|block|critical|subroutine|function|module|submodule|program|interface|type|enum|procedure|team))?\\b|else\\b|elseif\\b|elsewhere\\b|case\\b|rank\\b|(type|class)\\s+is\\b|class\\s+default\\b|contains\\b)"
